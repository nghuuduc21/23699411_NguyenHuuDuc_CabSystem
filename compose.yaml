# Tên riêng để không dùng chung hệ thống cab-slide13 của bản tham khảo.
name: cab-system

services:
  identity-db:
    # PostgreSQL là chương trình lưu và truy vấn dữ liệu.
    image: postgres:17.6-alpine

    environment:
      # Docker Compose lấy giá trị từ file .env tại thư mục dự án.
      POSTGRES_USER: ${IDENTITY_DB_USER:?Missing IDENTITY_DB_USER}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?Missing IDENTITY_DB_PASSWORD}
      POSTGRES_DB: ${IDENTITY_DB_NAME:?Missing IDENTITY_DB_NAME}

    ports:
      # Bên trái: cổng trên máy Windows.
      # Bên phải: cổng PostgreSQL bên trong container.
      # Chỉ cho kết nối từ máy hiện tại.
      - "127.0.0.1:5433:5432"

    volumes:
      # Giữ dữ liệu khi container được tạo lại.
      - identity-data:/var/lib/postgresql/data

    healthcheck:
      # Kiểm tra PostgreSQL đã sẵn sàng nhận kết nối chưa.
      # $$ để Compose chuyển ký tự $ vào container.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  identity-data: