openapi: 3.0.0
info:
  title: CAB System API - Driver Response
  description: 'Nghiệp vụ: Driver Response. Xử lý phản hồi của tài xế đối với yêu cầu chuyến (FR07–FR10)'
  version: 1.0.0
servers:
- url: http://localhost:8080/api/v1
  description: Local server
tags:
- name: Driver Response
  description: Xử lý phản hồi của tài xế đối với yêu cầu chuyến (FR07–FR10)
security:
- bearerAuth: []
paths:
  /driver-requests/{requestId}/accept:
    parameters:
    - $ref: '#/components/parameters/RequestIdParam'
    post:
      summary: Tài xế chấp nhận chuyến
      description: 'FR07 — Xử lý tài xế chấp nhận chuyến (AC06)

        BRULE04 — tài xế phải phản hồi trong thời gian quy định

        '
      operationId: acceptDriverRequest
      tags:
      - Driver Response
      responses:
        '200':
          description: Tài xế được xác nhận phân công cho chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '409':
          description: Yêu cầu đã hết hạn hoặc đã được xử lý
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /driver-requests/{requestId}/reject:
    parameters:
    - $ref: '#/components/parameters/RequestIdParam'
    post:
      summary: Tài xế từ chối chuyến
      description: 'FR08 — Xử lý tài xế từ chối chuyến (AC07)

        BRULE05 — hệ thống tiếp tục tìm tài xế khác, không hủy booking

        '
      operationId: rejectDriverRequest
      tags:
      - Driver Response
      responses:
        '200':
          description: Yêu cầu bị từ chối, hệ thống tiếp tục tìm tài xế khác
  /driver-requests/{requestId}:
    parameters:
    - $ref: '#/components/parameters/RequestIdParam'
    get:
      summary: Xem chi tiết một yêu cầu chuyến gửi đến tài xế
      description: 'FR06 — Gửi yêu cầu nhận chuyến cho tài xế

        FR09 — Xử lý tài xế không phản hồi (hệ thống tự đánh dấu EXPIRED khi hết `respond_by`) (AC08)

        '
      operationId: getDriverRequestById
      tags:
      - Driver Response
      responses:
        '200':
          description: Thông tin yêu cầu chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverRequest'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RequestIdParam:
      name: requestId
      in: path
      required: true
      description: ID của yêu cầu chuyến gửi đến tài xế
      schema:
        type: integer
        format: int64
  responses:
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Vehicle:
      type: object
      properties:
        vehicle_id:
          type: integer
          format: int64
        driver_id:
          type: integer
          format: int64
        vehicle_type_id:
          type: integer
          format: int64
        license_plate:
          type: string
        brand:
          type: string
        model:
          type: string
        color:
          type: string
        status:
          type: string
          enum:
          - active
          - inactive
    DriverRequestStatus:
      type: string
      enum:
      - PENDING
      - ACCEPTED
      - REJECTED
      - EXPIRED
    DriverRequest:
      type: object
      properties:
        request_id:
          type: integer
          format: int64
        booking_id:
          type: integer
          format: int64
        driver_id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/DriverRequestStatus'
        sent_at:
          type: string
          format: date-time
        respond_by:
          type: string
          format: date-time
          description: BRULE04 — hạn phản hồi của tài xế
    TripStatus:
      type: string
      enum:
      - DRIVER_ASSIGNED
      - ARRIVED_AT_PICKUP
      - PICKED_UP
      - IN_PROGRESS
      - COMPLETED
      - CANCELLED
    Trip:
      type: object
      properties:
        trip_id:
          type: integer
          format: int64
        booking_id:
          type: integer
          format: int64
        driver_id:
          type: integer
          format: int64
        customer_id:
          type: integer
          format: int64
        vehicle:
          $ref: '#/components/schemas/Vehicle'
        status:
          $ref: '#/components/schemas/TripStatus'
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
          nullable: true
        distance:
          type: number
          format: float
          description: Đơn vị km
        duration:
          type: integer
          description: Đơn vị giây
        eta_seconds:
          type: integer
          description: FR15 — thời gian dự kiến tài xế đến điểm đón
        fare_amount:
          type: number
          format: float
          nullable: true
    Error:
      type: object
      properties:
        error_code:
          type: string
        message:
          type: string
