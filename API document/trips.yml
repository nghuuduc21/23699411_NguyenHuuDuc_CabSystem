openapi: 3.0.0
info:
  title: CAB System API - Trips
  description: 'Nghiệp vụ: Trips. Quản lý và theo dõi chuyến đi (FR11–FR15)'
  version: 1.0.0
servers:
- url: http://localhost:8080/api/v1
  description: Local server
tags:
- name: Trips
  description: Quản lý và theo dõi chuyến đi (FR11–FR15)
security:
- bearerAuth: []
paths:
  /trips/{tripId}:
    parameters:
    - $ref: '#/components/parameters/TripIdParam'
    get:
      summary: Xem chi tiết chuyến đi (tài xế, phương tiện, trạng thái, ETA)
      description: 'FR11 — Xác nhận tài xế cho chuyến

        FR14 — Hiển thị thông tin chuyến đi

        FR15 — Tính thời gian dự kiến tài xế đến

        UC04 — Theo dõi chuyến đi (AC10)

        '
      operationId: getTripById
      tags:
      - Trips
      responses:
        '200':
          description: Thông tin chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '404':
          $ref: '#/components/responses/NotFound'
  /trips/{tripId}/status:
    parameters:
    - $ref: '#/components/parameters/TripIdParam'
    patch:
      summary: Tài xế cập nhật trạng thái chuyến đi
      description: 'FR12 — Cập nhật trạng thái chuyến đi (arrived, picked_up, in_progress, completed)

        UC05 — Thực hiện chuyến đi

        '
      operationId: updateTripStatus
      tags:
      - Trips
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  $ref: '#/components/schemas/TripStatus'
      responses:
        '200':
          description: Trạng thái chuyến được cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '409':
          description: Chuyển trạng thái không hợp lệ theo trình tự chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /trips/{tripId}/locations:
    parameters:
    - $ref: '#/components/parameters/TripIdParam'
    get:
      summary: Lịch sử vị trí của tài xế trong chuyến đi
      description: FR13 — Theo dõi vị trí tài xế
      operationId: getTripLocations
      tags:
      - Trips
      responses:
        '200':
          description: Danh sách vị trí đã ghi nhận trong chuyến
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DriverLocation'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TripIdParam:
      name: tripId
      in: path
      required: true
      description: ID của chuyến đi
      schema:
        type: integer
        format: int64
  responses:
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    LocationUpdate:
      type: object
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        recorded_at:
          type: string
          format: date-time
    DriverLocation:
      allOf:
      - $ref: '#/components/schemas/LocationUpdate'
      - type: object
        properties:
          location_id:
            type: integer
            format: int64
          driver_id:
            type: integer
            format: int64
    Vehicle:
      type: object
      properties:
        vehicle_id:
          type: integer
          format: int64
        driver_id:
          type: integer
          format: int64
        vehicle_type_id:
          type: integer
          format: int64
        license_plate:
          type: string
        brand:
          type: string
        model:
          type: string
        color:
          type: string
        status:
          type: string
          enum:
          - active
          - inactive
    TripStatus:
      type: string
      enum:
      - DRIVER_ASSIGNED
      - ARRIVED_AT_PICKUP
      - PICKED_UP
      - IN_PROGRESS
      - COMPLETED
      - CANCELLED
    Trip:
      type: object
      properties:
        trip_id:
          type: integer
          format: int64
        booking_id:
          type: integer
          format: int64
        driver_id:
          type: integer
          format: int64
        customer_id:
          type: integer
          format: int64
        vehicle:
          $ref: '#/components/schemas/Vehicle'
        status:
          $ref: '#/components/schemas/TripStatus'
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
          nullable: true
        distance:
          type: number
          format: float
          description: Đơn vị km
        duration:
          type: integer
          description: Đơn vị giây
        eta_seconds:
          type: integer
          description: FR15 — thời gian dự kiến tài xế đến điểm đón
        fare_amount:
          type: number
          format: float
          nullable: true
    Error:
      type: object
      properties:
        error_code:
          type: string
        message:
          type: string
