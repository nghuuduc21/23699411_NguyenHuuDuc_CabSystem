openapi: 3.0.0
info:
  title: CAB System API - Vehicles
  description: 'Nghiệp vụ: Vehicles. Quản lý phương tiện của tài xế (FR29)'
  version: 1.0.0
servers:
- url: http://localhost:8080/api/v1
  description: Local server
tags:
- name: Vehicles
  description: Quản lý phương tiện của tài xế (FR29)
security:
- bearerAuth: []
paths:
  /drivers/me/vehicles:
    get:
      summary: Danh sách phương tiện của tài xế
      description: FR29 — Quản lý phương tiện
      operationId: listMyVehicles
      tags:
      - Vehicles
      responses:
        '200':
          description: Danh sách phương tiện
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
    post:
      summary: Thêm phương tiện mới
      description: FR29 — Quản lý phương tiện
      operationId: createVehicle
      tags:
      - Vehicles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleCreateRequest'
      responses:
        '201':
          description: Phương tiện được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
  /vehicles/{vehicleId}:
    parameters:
    - name: vehicleId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    put:
      summary: Cập nhật thông tin phương tiện
      operationId: updateVehicle
      tags:
      - Vehicles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleCreateRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Ngừng sử dụng / xóa phương tiện
      operationId: deleteVehicle
      tags:
      - Vehicles
      responses:
        '204':
          description: Xóa thành công
        '404':
          $ref: '#/components/responses/NotFound'
  /vehicle-types:
    get:
      summary: Danh sách loại xe hỗ trợ
      operationId: listVehicleTypes
      tags:
      - Vehicles
      security: []
      responses:
        '200':
          description: Danh sách loại xe
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleType'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Dữ liệu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    VehicleType:
      type: object
      properties:
        vehicle_type_id:
          type: integer
          format: int64
        name:
          type: string
          example: Sedan 4 chỗ
        description:
          type: string
        capacity:
          type: integer
        status:
          type: string
          enum:
          - active
          - inactive
    Vehicle:
      type: object
      properties:
        vehicle_id:
          type: integer
          format: int64
        driver_id:
          type: integer
          format: int64
        vehicle_type_id:
          type: integer
          format: int64
        license_plate:
          type: string
        brand:
          type: string
        model:
          type: string
        color:
          type: string
        status:
          type: string
          enum:
          - active
          - inactive
    VehicleCreateRequest:
      type: object
      required:
      - vehicle_type_id
      - license_plate
      - brand
      - model
      properties:
        vehicle_type_id:
          type: integer
          format: int64
        license_plate:
          type: string
        brand:
          type: string
        model:
          type: string
        color:
          type: string
    Error:
      type: object
      properties:
        error_code:
          type: string
        message:
          type: string
