openapi: 3.0.0
info:
  title: CAB System API - Fare
  description: 'Nghiệp vụ: Fare. Tính cước chuyến đi (FR16)'
  version: 1.0.0
servers:
- url: http://localhost:8080/api/v1
  description: Local server
tags:
- name: Fare
  description: Tính cước chuyến đi (FR16)
security:
- bearerAuth: []
paths:
  /trips/{tripId}/fare:
    parameters:
    - $ref: '#/components/parameters/TripIdParam'
    get:
      summary: Xem thông tin cước của chuyến đi
      description: 'FR16 — Tính cước chuyến đi

        BRULE08 — chỉ tính cước khi chuyến đã hoàn thành

        '
      operationId: getTripFare
      tags:
      - Fare
      responses:
        '200':
          description: Thông tin cước
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fare'
        '409':
          description: Chuyến đi chưa hoàn thành, chưa thể tính cước
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TripIdParam:
      name: tripId
      in: path
      required: true
      description: ID của chuyến đi
      schema:
        type: integer
        format: int64
  schemas:
    Fare:
      type: object
      properties:
        fare_id:
          type: integer
          format: int64
        trip_id:
          type: integer
          format: int64
        base_fare:
          type: number
          format: float
        distance_fare:
          type: number
          format: float
        time_fare:
          type: number
          format: float
        extra_fee:
          type: number
          format: float
        total_amount:
          type: number
          format: float
        calculated_at:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        error_code:
          type: string
        message:
          type: string
