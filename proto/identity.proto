// Hợp đồng giao tiếp giữa Gateway (client) và Identity (server).
// Hai bên cùng đọc file này, nên thay đổi phải giữ tương thích:
// chỉ thêm field mới với số thứ tự mới, không đổi hoặc tái sử dụng số cũ.
syntax = "proto3";

package cab.identity.v1;

service IdentityService {
  // Readiness: Identity và database có sẵn sàng phục vụ không.
  rpc Check (CheckRequest) returns (CheckResponse);

  // Đăng ký tài khoản Customer.
  // Lỗi trả qua gRPC status, details là mã lỗi nghiệp vụ:
  // INVALID_ARGUMENT (INVALID_PHONE, ...), ALREADY_EXISTS (ACCOUNT_ALREADY_EXISTS),
  // UNAVAILABLE (REGISTRATION_UNAVAILABLE).
  rpc Register (RegisterRequest) returns (Account);
}

message CheckRequest {}

message CheckResponse {
  string service = 1;
  // "ready" hoặc "not_ready".
  string status = 2;
  map<string, string> dependencies = 3;
}

message RegisterRequest {
  string full_name = 1;
  string phone = 2;
  // optional: phân biệt "không gửi" với chuỗi rỗng.
  optional string email = 3;
  string password = 4;
  optional string role = 5;
}

message Account {
  // Dạng chuỗi để các service khác không phụ thuộc kiểu cột trong Identity DB.
  string account_id = 1;
  string full_name = 2;
  optional string email = 3;
  string phone = 4;
  string role = 5;
  string status = 6;
  // Thời điểm dạng ISO 8601.
  string created_at = 7;
}
