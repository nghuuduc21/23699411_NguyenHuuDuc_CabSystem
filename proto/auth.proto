// Hợp đồng gRPC của auth-service (spec 09-10 mục 5).
// Gateway gọi hai rpc công khai này; auth-service không gọi service nào khác (A8, ADR-013).
// Lỗi trả bằng gRPC status kèm `details` đúng bằng mã lỗi, ví dụ ALREADY_EXISTS + "PHONE_ALREADY_EXISTS".
// Spec 12-13-21-23 thêm RequestDriverOtp, RegisterDriver (đăng ký tài xế bằng OTP, mục chấm 21).
syntax = "proto3";

package cab.auth.v1;

service AuthService {
  // A04 POST /api/v1/auth/register — chỉ tạo tài khoản role `customer` bằng email; client không chọn được role.
  rpc RegisterCustomer (RegisterCustomerRequest) returns (RegisterCustomerResponse);
  // A05 POST /api/v1/auth/login — cả ba role đăng nhập cùng một rpc: khách, admin bằng email; tài xế bằng số (ADR-021).
  rpc Login (LoginRequest) returns (LoginResponse);
  // A07 POST /api/v1/auth/otp — xin OTP cho số chưa có tài khoản. "Gửi SMS" = ghi log (ADR-014).
  rpc RequestDriverOtp (RequestDriverOtpRequest) returns (RequestDriverOtpResponse);
  // A08 POST /api/v1/auth/driver-register — kiểm tra OTP rồi tạo tài khoản role `driver`; trả luôn token
  // để tài xế nộp hồ sơ ngay, bớt một request đăng nhập (04 P15).
  rpc RegisterDriver (RegisterDriverRequest) returns (RegisterDriverResponse);
}

message RegisterCustomerRequest {
  // Số 1 từng là `phone` (bỏ 2026-10-14, ADR-021: khách không còn số ở tài khoản; số liên hệ ở hồ sơ).
  // `reserved` để không ai dùng lại số 1 / tên `phone` với nghĩa khác.
  reserved 1;
  reserved "phone";
  // Dùng LẠI số 2 cho `email`: cùng tên, cùng kiểu, cùng nghĩa như trước 2026-10-05, nên không bên nào
  // hiểu số 2 theo nghĩa khác (spec 09-10 mục 5).
  string email = 2;
  string password = 3; // giữ số 3: đổi số field là phá hợp đồng với bên gọi cũ
}

message RegisterCustomerResponse {
  int64 account_id = 1; // mã tạo qua API bắt đầu từ 1000 (ADR-015)
  string role = 2;      // luôn "customer"
}

message LoginRequest {
  // ĐÚNG MỘT trong hai định danh (DN1 sửa 2026-10-14, ADR-021): tài xế gửi `phone`, khách / admin gửi `email`.
  // `optional` để phân biệt "không gửi" với "chuỗi rỗng" khi kiểm "đúng một định danh".
  optional string phone = 1;
  optional string email = 2;  // dùng lại số 2: cùng tên, cùng nghĩa như trước 2026-10-05
  string password = 3;
}

message LoginResponse {
  string token = 1;      // JWT HS256
  int64 account_id = 2;
  string role = 3;
  int32 expires_in = 4;  // giây, bằng JWT_TTL_SECONDS
}

message RequestDriverOtpRequest {
  string phone = 1;
}

message RequestDriverOtpResponse {
  string phone = 1;          // số đã chuẩn hóa về 0 + 9 chữ số
  int32 expires_in = 2;      // giây, bằng OTP_TTL_SECONDS
  // Chỉ có khi SIMULATION_MODE=true (ADR-014): Postman dùng tiếp mà không cần SMS thật.
  optional string otp = 3;
}

message RegisterDriverRequest {
  string phone = 1;
  string otp = 2;            // 6 chữ số
  string password = 3;
}

message RegisterDriverResponse {
  int64 account_id = 1;      // cũng là driver_id khi nộp hồ sơ (A11): hai service không gọi nhau
  string role = 2;           // luôn "driver"
  string token = 3;          // JWT HS256, cùng dạng với Login
  int32 expires_in = 4;      // giây, bằng JWT_TTL_SECONDS
}
